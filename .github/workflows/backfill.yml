name: Backfill Newsletter

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: 'Start date (YYYY-MM-DD, inclusive)'
        required: true
      end_date:
        description: 'End date (YYYY-MM-DD, inclusive, default: yesterday)'
        required: false
        default: ''
      force:
        description: 'Re-run dates that already exist in the database'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

jobs:
  backfill:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      run: |
        docker buildx build --load \
          --cache-from type=gha \
          --cache-to type=gha,mode=max \
          -t newsletter-app .

    - name: Run Backfill
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        GOOGLE_KEY: ${{ secrets.GOOGLE_KEY }}
        GOOGLE_EMBEDDING_KEY: ${{ secrets.GOOGLE_EMBEDDING_KEY }}
        fred_api_key: ${{ secrets.FRED_API_KEY }}
        NewsApikey: ${{ secrets.NEWSAPIKEY }}
        START_DATE: ${{ github.event.inputs.start_date }}
        END_DATE: ${{ github.event.inputs.end_date }}
        FORCE: ${{ github.event.inputs.force }}
      run: |
        ARGS="--start-date $START_DATE"
        [ -n "$END_DATE" ] && ARGS="$ARGS --end-date $END_DATE"
        [ "$FORCE" = "true" ] && ARGS="$ARGS --force"

        docker run \
          -e SUPABASE_URL \
          -e SUPABASE_SERVICE_KEY \
          -e GOOGLE_KEY \
          -e GOOGLE_EMBEDDING_KEY \
          -e fred_api_key \
          -e NewsApikey \
          newsletter-app python3 backfill.py $ARGS
