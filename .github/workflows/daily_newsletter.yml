name: Daily Market Newsletter

on:
  schedule:
    # Runs at 20:45 UTC (4:45 PM ET approx) every Monday through Friday
    - cron: '45 20 * * 1-5'
  workflow_dispatch:  # Allows manual triggering

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build Docker Image
      run: |
        docker buildx build --load \
          --cache-from type=gha \
          --cache-to type=gha,mode=max \
          -t newsletter-app .

    - name: Run Newsletter Collector in Docker
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        GOOGLE_KEY: ${{ secrets.GOOGLE_KEY }}
        fred_api_key: ${{ secrets.FRED_API_KEY }}
        NewsApikey: ${{ secrets.NEWSAPIKEY }}
      run: |
        docker run \
          -e SUPABASE_URL \
          -e SUPABASE_SERVICE_KEY \
          -e GOOGLE_KEY \
          -e fred_api_key \
          -e NewsApikey \
          newsletter-app python3 newsletter_collector.py
