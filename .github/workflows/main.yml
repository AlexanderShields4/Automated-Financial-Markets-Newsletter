
name: Daily Market Newsletter

on:
  schedule:
    # Runs at 20:45 UTC (4:45 PM ET approx) every Monday through Friday
    - cron: '45 20 * * 1-5'
  workflow_dispatch:  # Allows manual triggering

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Newsletter Collector
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        GOOGLE_KEY: ${{ secrets.GOOGLE_KEY }}
        GOOGLE_EMBEDDING_KEY: ${{ secrets.GOOGLE_KEY }}
        fred_api_key: ${{ secrets.FRED_API_KEY }}
        NewsApikey: ${{ secrets.NEWSAPIKEY }}
      run: |
        python newsletter_collector.py
